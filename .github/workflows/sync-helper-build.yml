name: Build Sync Helper APK
on:
  push:
    branches: [sync-helper-build-temp]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Android project
        run: |
          base64 -d sync-helper-apk/project.zip.b64 > /tmp/sync-helper.zip
          unzip -q /tmp/sync-helper.zip -d /tmp/sync-helper-src
          mv /tmp/sync-helper-src/SyncHelperLocalWifi sync-helper-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: sync-helper-source
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SyncHelper-S25-S26-debug
          path: sync-helper-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
